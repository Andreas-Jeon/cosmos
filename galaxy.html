<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cosmos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#141413;--panel:#1C1C1A;--line:#30302D;--text:#ECECE8;--sub:#A4A49D;--mute:#8B8B85;--khaki:#A8A66A;--khaki-l:#C9C68A;--orange:#C98A5B;--sky:#0D0D0C}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:14px}
button,input{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;padding:14px 20px;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:700;letter-spacing:.08em}
.search{margin-left:auto;width:320px;max-width:100%;height:38px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:var(--panel)}
.search::placeholder{color:var(--mute)}
.stamp{font-size:12px;color:var(--mute)}
main{display:grid;grid-template-columns:minmax(0,1fr) 420px;min-height:0}
main.nopanel{grid-template-columns:minmax(0,1fr);grid-template-rows:minmax(0,1fr)!important}
main.nopanel aside{display:none}
.ptog{border:1px solid var(--line);background:none;border-radius:8px;height:36px;padding:0 12px;cursor:pointer;color:var(--sub);font-size:13px}
.ptog[aria-pressed="true"]{border-color:var(--khaki);color:var(--text)}
.sky{position:relative;min-height:0;background:var(--sky)}
.sky canvas{display:block;width:100%;height:100%;touch-action:none;cursor:grab}
.chips{position:absolute;left:14px;top:14px;right:70px;display:flex;flex-wrap:wrap;gap:6px}
.chip{min-height:36px;padding:0 12px;border-radius:8px;border:1px solid var(--line);background:rgba(20,20,19,.85);cursor:pointer;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--orange);background:#2A2420}
.chip .n{color:var(--mute);margin-left:6px;font-size:12px}
.zoom{position:absolute;right:14px;bottom:14px;display:flex;flex-direction:column;gap:6px}
.zoom button[aria-pressed="true"]{border-color:var(--orange)}
.zoom button{width:40px;height:40px;border-radius:8px;border:1px solid var(--line);background:rgba(28,28,26,.9);cursor:pointer;font-size:18px}
.hint{position:absolute;left:14px;bottom:14px;font-size:12px;color:var(--mute)}
aside{border-left:1px solid var(--line);background:var(--panel);overflow-y:auto;padding:20px 22px 40px}
aside h2{margin:0 0 4px;font-size:18px;font-weight:500}
.path{font-size:12px;color:var(--mute);word-break:break-all}
.meta{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
.tag{font-size:12px;border:1px solid var(--line);border-radius:6px;padding:2px 8px;color:var(--sub)}
.tag.warn{border-color:var(--orange);color:var(--orange)}
.sec{margin:20px 0 8px;font-size:13px;color:var(--sub)}
.list{display:flex;flex-direction:column}
.item{display:block;width:100%;text-align:left;padding:9px 10px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.item:hover{background:#242422}
.item small{display:block;color:var(--mute);font-size:12px;margin-top:2px}
.empty{color:var(--mute);font-size:13px;line-height:1.7}
.back{border:0;background:none;color:var(--orange);cursor:pointer;padding:0;margin-bottom:12px;font-size:13px}
.md{line-height:1.75;font-size:14px}
.md h1,.md h2,.md h3,.md h4{font-weight:500;margin:20px 0 6px}
.md h1{font-size:18px}.md h2{font-size:16px}.md h3,.md h4{font-size:14px;color:var(--sub)}
.md p{margin:6px 0}
.md ul{margin:4px 0;padding-left:18px}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:2px solid var(--khaki);color:var(--sub)}
.md table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md th{color:var(--sub);font-weight:500}
.md code{background:#262624;padding:1px 5px;border-radius:4px;font-size:13px}
.md pre{background:#262624;padding:10px;border-radius:8px;overflow-x:auto;font-size:12px;line-height:1.5}
.md a{color:var(--orange);cursor:pointer}
.md .own{color:var(--khaki-l)}
.md .gap{color:var(--orange)}
.fm{font-size:12px;color:var(--sub);border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin-bottom:10px}
.fm div{display:flex;gap:8px}.fm b{font-weight:500;color:var(--mute);min-width:90px}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{border:1px solid var(--line);border-radius:8px;padding:10px}
.stat .v{font-size:20px;font-weight:500}.stat .l{font-size:12px;color:var(--mute)}
.facets{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.facet{min-height:30px;padding:0 10px;border-radius:6px;border:1px solid var(--line);background:none;cursor:pointer;font-size:12px;color:var(--sub)}
.facet[aria-pressed="true"]{border-color:var(--orange);color:var(--text)}
.facet .n{color:var(--mute);margin-left:4px}
.imp{color:var(--khaki-l);font-size:12px;letter-spacing:-1px}
.item mark{background:none;color:var(--orange);font-weight:500}
.item .snip{display:block;color:var(--sub);font-size:12px;margin-top:3px;line-height:1.5}
.more{width:100%;min-height:38px;margin-top:6px;border:1px solid var(--line);border-radius:8px;background:none;cursor:pointer;color:var(--sub)}
.qhint{font-size:12px;color:var(--mute);line-height:1.6;margin:6px 0 0}
@media (max-width:900px){main{grid-template-columns:1fr;grid-template-rows:60vh auto}aside{border-left:0;border-top:1px solid var(--line)}}

/* ---- mobile ---- */
.gnav{order:10;width:100%;display:flex;gap:4px}
.gnav a{flex:1 0 auto;min-height:40px;display:flex;align-items:center;justify-content:center;color:var(--sub);text-decoration:none;font-size:15px;border-bottom:2px solid transparent}
.gnav a[aria-current="true"]{color:var(--text);border-bottom-color:var(--khaki)}
.hdbtn{border:1px solid var(--line);background:none;border-radius:8px;min-width:36px;height:36px;cursor:pointer;color:var(--sub)}
.ldbanner{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;min-height:44px;border-radius:10px;border:1px solid var(--orange);background:#2A2420;color:var(--text);font-size:14px}
@media (max-width:900px){
 .app{height:100dvh}
 header{padding:10px 12px;gap:8px;padding-top:calc(10px + env(safe-area-inset-top))}
 .brand{font-size:17px}
 .stamp{margin-left:auto;font-size:11px}
 .search{order:9;width:100%;margin-left:0;height:42px;font-size:16px}
 main{grid-template-rows:44dvh minmax(0,1fr)}
 main.skybig{grid-template-rows:78dvh minmax(0,1fr)}
 aside{padding:14px 14px calc(40px + env(safe-area-inset-bottom))}
 .chips{left:8px;top:8px;right:54px;gap:4px;max-height:46%;overflow:hidden}
 .chip{min-height:30px;padding:0 8px;font-size:12px}
 .zoom{right:8px;bottom:8px}
 .hint{display:none}
 .item{padding:12px 8px}
 .facet{min-height:34px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">Cosmos</div><nav class="gnav"><a aria-current="true">은하</a><a href="./?v=daily">오늘</a><a href="./?v=write">쓰기</a><a href="./?v=flow">흐름</a><a href="./?v=find">찾기</a></nav>
  <input class="search" id="q" type="search" placeholder="낱말 여러 개로 좁혀 찾기 (예: 태양 교정)" aria-label="검색">
  <span class="stamp" id="stamp"></span><button class="hdbtn" onclick="cosmosRefresh()" aria-label="OneDrive에서 다시 받기" title="OneDrive에서 다시 받기">↻</button><button class="hdbtn" onclick="cosmosLogout()" aria-label="로그아웃" title="로그아웃">⏻</button><button class="ptog" id="ptog" aria-pressed="false" aria-label="목록 열기·닫기">목록</button>
</header>
<main class="nopanel">
  <section class="sky" aria-label="지식 은하">
    <canvas id="cv" role="img" aria-label="Cosmos 폴더의 파일로 그린 은하. 중심은 나와 대문, 항성은 층, 행성은 파일"></canvas>
    <div class="chips" id="chips"></div>
    <div class="zoom"><button id="zbig" aria-label="크게 보기" onclick="document.querySelector('main').classList.toggle('skybig')">⤢</button><button id="zspin" aria-label="회전 켜기·끄기" aria-pressed="true" title="회전">⟳</button><button id="zin" aria-label="확대">+</button><button id="zout" aria-label="축소">−</button></div>
    <div class="hint">끌어서 돌리기 · 두 손가락으로 확대 · 이름을 누르면 열림</div>
  </section>
  <aside id="panel" aria-live="polite"></aside>
</main>
</div>
<script src="msal-browser.min.js"></script>
<script type="text/plain" id="cosmos-main">
(function(){
"use strict";
const DATA = window.COSMOS_DATA;
const panel = document.getElementById('panel');
/* 오른쪽 목록: 기본은 접어 둠. 무언가를 누르거나 찾으면 저절로 펼침 */
const mainEl = document.querySelector('main'), ptog = document.getElementById('ptog');
const setPanel = on => { mainEl.classList.toggle('nopanel', !on); if (ptog) ptog.setAttribute('aria-pressed', String(on)); };
if (ptog) { ptog.addEventListener('click', () => setPanel(mainEl.classList.contains('nopanel'))); setPanel(!mainEl.classList.contains('nopanel')); }
let lastAct = 0;
['pointerup', 'keyup', 'input'].forEach(ev => document.addEventListener(ev, e => { if (e.target !== ptog) lastAct = Date.now(); }, true));
new MutationObserver(() => { if (Date.now() - lastAct < 1200 && mainEl.classList.contains('nopanel')) setPanel(true); }).observe(panel, {childList: true});
if (!DATA) {
  panel.innerHTML = '<h2>색인이 없음</h2><p class="empty">업무 PC에서 Cosmos_open.bat 를 한 번 실행해 색인(data.js)을 만든 뒤 OneDrive 동기화가 끝나면 열림.</p>';
  return;
}
const esc = s => String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
document.getElementById('stamp').textContent = '색인 ' + DATA.generated;

const SYS = [
  {key:'card', keys:['card'], name:'별자리', r:520, ph:0.3, col:'#A8A66A'},
  {key:'stream', keys:['stream'], name:'흐름', r:760, ph:1.9, col:'#D8D8D2'},
  {key:'daily', keys:['daily'], name:'하루', r:1000, ph:3.4, col:'#C4C4BE'},
  {key:'notes', keys:['principles','cases','capabilities','work','base'], name:'지난 노트', r:1240, ph:4.6, col:'#C4C4BE'},
  {key:'tools', keys:['tools','library','log','root','other'], name:'도구 상자', r:1460, ph:5.7, col:'#B0B0AA'}
];
const FILES = DATA.files;
const byPath = {}, byName = {};
FILES.forEach(f => { byPath[f.path.replace(/\.md$/,'')] = f; (byName[f.name] = byName[f.name] || []).push(f); });
const SRC = DATA.sources || [];
const ITEMS = [], itemByName = {};
/* 중요도: 파일 이름 앞의 [중요] 표시. '중요'와 '매우'가 반복될수록 높음 ([중요]=1, [중요중요]·[매우중요]=2, [매우매우중요]=3) */
const impOf = name => {
  const m = String(name).match(/^\s*((?:\[[^\]]*\]\s*_?\s*)+|중요[_ ])/); if (!m) return 0;
  const tag = m[1].split(']').filter(t => /중요/.test(t)).join(' ');
  return Math.min(5, (tag.match(/중요/g) || []).length + (tag.match(/매우/g) || []).length);
};
const stars = n => n ? '<span class="imp" title="중요 표시 ' + n + '단계">' + '★'.repeat(n) + '</span> ' : '';
SRC.forEach((s, si) => s.items.forEach(it => { it.src = s.label; it.si = si; it.isItem = true; it.title = (it.meta && it.meta.t) || it.name; it.imp = impOf(it.name); it.fields = (it.meta && it.meta.f) || []; it.works = (it.meta && it.meta.w) || []; it.kws = (it.meta && it.meta.k) || []; ITEMS.push(it); (itemByName[it.name.toLowerCase()] = itemByName[it.name.toLowerCase()] || []).push(it); }));
const resolve = l => { l = l.trim(); const base = l.replace(/\.md$/,''); const md = byPath[base] || (byName[base.split('/').pop()] || [])[0]; if (md) return md; const nm = l.split('/').pop().replace(/\.(pdf|url|docx?|pptx?|hwpx?|xlsx?|txt|html?)$/i,'').toLowerCase(); return (itemByName[nm] || [])[0] || null; };
const keyOf = x => x.isItem ? 'item:' + x.full : x.path;
const CL = [];
/* 나선팔 = 주제(themes.csv 중 분야태그가 있는 주제). 이름은 괄호 속 한자를 뺀 쉬운 이름 */
const OLD_GROUPS = [
  {name:'우주환경·전파천문', tags:['우주환경·태양전파','전파천문','전파전파·강우감쇠']},
  {name:'레이다·영상', tags:['레이다 시스템','SAR·검보정','우주상황인식','국방·전자전']},
  {name:'안테나·RF', tags:['안테나·RF부품','방향탐지·전파감시']},
  {name:'위성·지상국', tags:['위성·지상국']},
  {name:'신호처리·계측', tags:['신호처리','측정·시험장비']},
  {name:'정책·사업', tags:['주파수·전파정책','기술기획·사업']}
];
const THEME_ARMS = (DATA.themes || []).filter(t => t['분야태그']).map(t => ({id:t.id, name:String(t['이름']).replace(/\s*\(.*?\)\s*/g, ''), en:t['영문'] || '', desc:t['설명'] || '', tags:String(t['분야태그']).split(';').map(x => x.trim()).filter(Boolean)}));
const GROUPS = THEME_ARMS.length ? THEME_ARMS : OLD_GROUPS;
const groupOfTag = t => GROUPS.findIndex(g => g.tags.includes(t));
const DEV_ARM = Math.max(0, GROUPS.findIndex(g => g.id === 'signal')) || 4;
const groupIdx = c => c.name.startsWith('개발 · ') ? DEV_ARM : groupOfTag(c.name);
const HAS_TAGS = ITEMS.some(it => it.fields.length);
let clMode = HAS_TAGS ? 'field' : 'folder';
/* 성단 묶음: 분야(태그 첫 번째) 또는 폴더. 태그 없는 자료는 폴더 이름으로 묶음 */
function buildClusters(mode){
  clMode = mode; CL.length = 0;
  SRC.forEach((s, si) => {
    const g = {};
    s.items.forEach(it => { const k = it.docs ? '개발 · ' + it.topic : (mode === 'field' && it.fields.length) ? it.fields[0] : (mode === 'field' ? '태그 없음' : it.topic); (g[k] = g[k] || []).push(it); });
    Object.keys(g).sort((a,b) => (a.startsWith('태그 없음') - b.startsWith('태그 없음')) || g[b].length - g[a].length).forEach(t => CL.push({src:s.label, si, name:t, items:g[t]}));
  });
  /* 분야 모드: 큰 분야 6개를 6개 나선팔로. 팔 안에서 분야 성단은 바깥으로 감기며 놓임 */
  const armN = {};
  CL.forEach((c, i) => {
  const gi = mode === 'field' ? groupIdx(c) : -1;
  if (gi >= 0) { const k = armN[gi] = (armN[gi] || 0) + 1; c.gi = gi; c.ph = gi / GROUPS.length * 6.283 + 0.25 + (k - 1) * 0.30; c.R = 1950 + (k - 1) * 330; c.y = ((k % 2) ? 1 : -1) * 50; }
  else { c.gi = -1; c.ph = i / Math.max(1, CL.length) * 6.283 + 0.4; c.R = mode === 'field' ? 3350 + (i % 2) * 150 : 2150 + (i % 3) * 110; c.y = ((i % 2) ? 1 : -1) * 70; }
  c.rc = clMode === 'field' ? 20 + 7 * Math.sqrt(c.items.length) : 14 + 4 * Math.sqrt(c.items.length);
  c.items.forEach((it, k) => { let hh = 7; for (const ch of it.full) hh = (hh * 33 + ch.charCodeAt(0)) % 100003; const u = (hh % 1000) / 1000 * 2 - 1, th = ((hh / 1000 | 0) % 1000) / 1000 * 6.283, rr = c.rc * Math.cbrt(((hh * 7) % 997) / 997 + 0.02), s = Math.sqrt(1 - u * u); it.off = [rr * s * Math.cos(th), rr * u * 0.7, rr * s * Math.sin(th)]; it.ci = i; });
  });
}
buildClusters(clMode);
/* 업무·분야별 자료 목록 */
const WORKS = {}, FIELDS = {};
ITEMS.forEach(it => { it.works.forEach(w => (WORKS[w] = WORKS[w] || []).push(it)); it.fields.forEach(f => (FIELDS[f] = FIELDS[f] || []).push(it)); });
const byImp = (a, b) => b.imp - a.imp || a.title.localeCompare(b.title);
/* 관련 자료: 같은 키워드(3점) · 같은 업무(2점) · 같은 분야(1점), 같은 제목(사본)은 뺌 */
function relatedOf(it, n){
  if (!it.fields.length) return [];
  const kw = new Set(it.kws.map(k => k.toLowerCase()));
  return ITEMS.filter(o => o !== it && o.fields.length && o.title.toLowerCase() !== it.title.toLowerCase()).map(o => {
    let sc = 0; o.kws.forEach(k => { if (kw.has(k.toLowerCase())) sc += 3; });
    o.works.forEach(w => { if (it.works.includes(w)) sc += 2; });
    o.fields.forEach(f => { if (it.fields.includes(f)) sc += 1; });
    return {o, sc: sc + o.imp * .3};
  }).filter(x => x.sc >= 3).sort((a, b) => b.sc - a.sc).slice(0, n).map(x => x.o);
}
/* 화면에서 함께 밝혀 줄 자료 묶음 (선으로 이음) */
let HL = {set:new Set(), from:null};
const setHL = (arr, from) => { HL = {set:new Set(arr), from}; };
const incoming = {};
FILES.forEach(f => f.links.forEach(l => { const t = resolve(l); if (t) (incoming[keyOf(t)] = incoming[keyOf(t)] || []).push(f); }));
SYS.forEach(s => {
  s.files = FILES.filter(f => s.keys.includes(f.layer) && f.kind === 'file');
  s.meta = FILES.filter(f => s.keys.includes(f.layer) && f.kind === 'meta');
  const n = s.files.length, span = Math.min(120, 15 * Math.max(n, 1));
  s.pl = s.files.map((f, k) => {
    const R = 34 + (n > 1 ? k * span / (n - 1) : 0);
    let h = 0; for (const ch of f.path) h = (h * 31 + ch.charCodeAt(0)) % 997;
    return {f, R, w: 2.0 * Math.pow(34 / R, 1.5), ph: h / 997 * 6.283, size: 3 + Math.min(3, f.size / 2500)};
  });
});
FILES.forEach(f => { f.fields = f.fields || []; });
const centerFile = FILES.find(f => f.path === 'AGENTS.md') || FILES.find(f => f.layer === 'center');

/* ---------- chips ---------- */
const chipsEl = document.getElementById('chips');
const chipDefs = [{i:-1, name:'전체', n:FILES.filter(f=>f.kind==='file').length}].concat(SYS.map((s,i)=>({i, name:s.name, n:s.files.length}))).concat(SRC.map((s,k)=>({i:500+k, name:s.label, n:s.items.length})));
chipDefs.forEach(c => {
  const b = document.createElement('button'); b.className = 'chip'; b.dataset.i = c.i;
  b.innerHTML = esc(c.name) + '<span class="n">' + c.n + '</span>';
  b.addEventListener('click', () => { if (c.i >= 500) { flyTo(-3); showSource(c.i - 500); } else { flyTo(c.i); if (c.i < 0) showOverview(); else showSystem(c.i); } });
  chipsEl.appendChild(b);
});
function markChip(i){ chipsEl.querySelectorAll('.chip').forEach(b => b.setAttribute('aria-pressed', String(+b.dataset.i === i))); }

/* ---------- markdown ---------- */
function inline(s){
  s = esc(s);
  s = s.replace(/`([^`]+)`/g, '<code>$1</code>');
  s = s.replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>');
  s = s.replace(/\[\[(.+?)(?:\|([^\]]+))?\]\](?!\])/g, (m, a, b) => '<a data-link="' + a.trim() + '">' + (b || a.split('/').pop()) + '</a>');
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/\[직접[^\]]*\]/g, m => '<span class="own">' + m + '</span>');
  s = s.replace(/_{6,}/g, '<span class="gap">______</span>');
  return s;
}
function md(text){
  const L = text.replace(/\r/g,'').split('\n'); let i = 0, out = '';
  if (L[0] === '---') {
    let j = 1, rows = '';
    while (j < L.length && L[j] !== '---') { const m = L[j].match(/^([^:]+):\s*(.*)$/); if (m) rows += '<div><b>' + esc(m[1]) + '</b><span>' + inline(m[2]) + '</span></div>'; j++; }
    out += '<div class="fm">' + rows + '</div>'; i = j + 1;
  }
  while (i < L.length) {
    const l = L[i];
    if (/^```/.test(l)) { let b = ''; i++; while (i < L.length && !/^```/.test(L[i])) { b += esc(L[i]) + '\n'; i++; } out += '<pre>' + b + '</pre>'; i++; continue; }
    let m = l.match(/^(#{1,4})\s+(.*)$/); if (m) { out += '<h' + m[1].length + '>' + inline(m[2]) + '</h' + m[1].length + '>'; i++; continue; }
    if (/^\s*\|/.test(l)) {
      let rows = []; while (i < L.length && /^\s*\|/.test(L[i])) { rows.push(L[i]); i++; }
      rows = rows.filter(r => !/^\s*\|[\s:|-]+\|\s*$/.test(r));
      out += '<table>' + rows.map((r, k) => '<tr>' + r.trim().replace(/^\||\|$/g,'').split('|').map(c => (k ? '<td>' : '<th>') + inline(c.trim()) + (k ? '</td>' : '</th>')).join('') + '</tr>').join('') + '</table>';
      continue;
    }
    if (/^\s*[-*]\s/.test(l)) { let b = ''; while (i < L.length && /^\s*[-*]\s/.test(L[i])) { b += '<li>' + inline(L[i].replace(/^\s*[-*]\s(\[ \]\s)?/, (x, c) => c ? '☐ ' : '')) + '</li>'; i++; } out += '<ul>' + b + '</ul>'; continue; }
    if (/^>\s?/.test(l)) { let b = ''; while (i < L.length && /^>\s?/.test(L[i])) { b += inline(L[i].replace(/^>\s?/,'')) + ' '; i++; } out += '<blockquote>' + b + '</blockquote>'; continue; }
    if (l.trim() === '') { i++; continue; }
    out += '<p>' + inline(l) + '</p>'; i++;
  }
  return out;
}

/* ---------- search ---------- */
/* ===== 검색 =====
   - 같은 뜻 낱말(한영·약어): _app/synonyms.txt 를 색인 만들 때 읽어 옴 (없으면 아래 기본 목록)
   - 붙여 쓴 한글은 사전 낱말로 나눔 (SAR검보정 → sar + 검보정, 태양전파관측 → 태양 + 전파 + 관측)
   - 영문은 어미가 달라도 찾음 (calibration ↔ calibrated), 철자 한두 자 틀려도 비슷한 낱말로 찾음
   - 모든 낱말이 맞는 자료를 먼저, 그다음 일부만 맞는 자료를 보여 줌 */
const SYN_BASE = [
  ['태양','solar','sun'], ['전파','radio'], ['안테나','antenna'], ['레이다','레이더','radar'],
  ['교정','보정','검보정','검교정','calibration','cal/val','calval'], ['위성','satellite'],
  ['합성개구레이다','합성개구레이더','sar','synthetic aperture radar'], ['관측','observation']
];
const SYN = (DATA.synonyms && DATA.synonyms.length) ? DATA.synonyms : SYN_BASE;
const norm = s => String(s || '').toLowerCase()
  .replace(/([a-z0-9])([가-힣])/g, '$1 $2').replace(/([가-힣])([a-z0-9])/g, '$1 $2')
  .replace(/[_\-.+()\[\],:;'"!?~·]+/g, ' ').replace(/\s+/g, ' ').trim();
const SYN_OF = {};
SYN.forEach(g => {
  const gg = g.map(norm).filter(Boolean);
  const keys = gg.concat(gg.filter(w => /[가-힣]/.test(w) && w.includes(' ')).map(w => w.replace(/ /g, '')));
  keys.forEach(w => { SYN_OF[w] = Array.from(new Set((SYN_OF[w] || []).concat(gg))); });
});
const KO_DICT = Object.keys(SYN_OF).filter(w => /^[가-힣]{2,}$/.test(w)).sort((a, b) => b.length - a.length);
const isWordCh = c => !!c && /[a-z0-9가-힣]/.test(c);
const isLatin = t => /^[a-z0-9 \/]+$/.test(t);

/* 낱말 찾기. mode: 'exact' 그대로 / 'prefix' 낱말 첫머리부터 (영문 어간) */
function findTerm(hay, t, mode){
  const strict = /^[a-z0-9]{1,3}$/.test(t) || /^\d+$/.test(t);
  const head = /^[가-힣]$/.test(t) || mode === 'prefix';
  let from = 0, best = null;
