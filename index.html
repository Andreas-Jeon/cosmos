<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141413">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Cosmos</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
:root{--bg:#141413;--panel:#1C1C1A;--line:#30302D;--text:#ECECE8;--sub:#A4A49D;--mute:#8B8B85;--khaki:#A8A66A;--khaki-l:#C9C68A;--orange:#C98A5B}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:'Noto Sans KR','Malgun Gothic',sans-serif;font-size:15px;line-height:1.6}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--orange);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--bg);border-bottom:1px solid var(--line);padding:10px 16px 0;padding-top:calc(10px + env(safe-area-inset-top))}
.top{display:flex;align-items:center;gap:10px;max-width:820px;margin:0 auto}
.brand{font-size:18px;font-weight:700;letter-spacing:.08em}
#sync{margin-left:auto;font-size:12px;color:var(--mute)}
.hb{border:1px solid var(--line);background:none;border-radius:8px;min-width:36px;height:36px;cursor:pointer;color:var(--sub)}
nav{display:flex;gap:4px;max-width:820px;margin:8px auto 0;overflow-x:auto}
nav button{flex:1 0 auto;min-height:44px;padding:0 14px;border:0;border-bottom:2px solid transparent;background:none;cursor:pointer;color:var(--sub);font-size:15px}
nav button[aria-current="true"]{color:var(--text);border-bottom-color:var(--khaki)}
main{max-width:820px;margin:0 auto;padding:16px 16px calc(60px + env(safe-area-inset-bottom))}
h2{font-size:18px;font-weight:500;margin:4px 0 10px}
h3{font-size:14px;font-weight:500;color:var(--sub);margin:24px 0 8px}
.quiet{color:var(--mute);font-size:13px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;line-height:1.7}
textarea::placeholder{color:var(--mute)}
.chips{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin:10px 0}
select{min-height:40px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:0 8px}
label.ck{display:flex;align-items:center;gap:6px;min-height:40px;color:var(--sub);font-size:14px}
.row{display:flex;align-items:center;gap:10px}
.primary{margin-left:auto;min-height:44px;padding:0 22px;border-radius:10px;border:1px solid var(--khaki);background:#26261C;cursor:pointer;font-weight:500}
.primary:disabled{opacity:.4;cursor:default}
.btn{min-height:40px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;color:var(--sub)}
.btn.on{border-color:var(--orange);color:var(--text)}
.list{display:flex;flex-direction:column}
.it{display:block;width:100%;text-align:left;padding:12px 6px;border:0;border-top:1px solid var(--line);background:none;cursor:pointer}
.it:hover{background:#1F1F1D}
.it .t{display:block}
.it small{display:block;color:var(--mute);font-size:12.5px;margin-top:2px}
.it .snip{display:block;color:var(--sub);font-size:13px;margin-top:3px;line-height:1.5}
.tag{display:inline-block;font-size:12px;border:1px solid var(--line);border-radius:6px;padding:0 7px;margin-right:6px;color:var(--sub);line-height:20px}
.tag.k{border-color:#4A4A36;color:var(--khaki-l)}
.pend{color:var(--orange)}
.day{margin:22px 0 4px;font-size:13px;color:var(--sub)}
.facets{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.facet{min-height:34px;padding:0 10px;border-radius:8px;border:1px solid var(--line);background:none;cursor:pointer;font-size:13px;color:var(--sub)}
.facet[aria-pressed="true"]{border-color:var(--khaki);color:var(--text)}
.facet .n{color:var(--mute);margin-left:4px}
.search{width:100%;height:46px;padding:0 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);font-size:16px}
mark{background:none;color:var(--orange);font-weight:500}
.back{border:0;background:none;color:var(--orange);cursor:pointer;padding:0;margin-bottom:12px;font-size:14px;min-height:36px}
.md{line-height:1.8}
.md h1{font-size:19px;font-weight:500;margin:6px 0 10px}
.md h2{font-size:15px;font-weight:500;color:var(--khaki-l);margin:22px 0 6px}
.md h3,.md h4{font-size:14px;color:var(--sub);margin:16px 0 4px}
.md p{margin:6px 0}
.md ul{margin:4px 0;padding-left:20px}
.md blockquote{margin:8px 0;padding:6px 12px;border-left:2px solid var(--khaki);color:var(--sub)}
.md table{border-collapse:collapse;width:100%;font-size:13.5px;margin:8px 0;display:block;overflow-x:auto}
.md th,.md td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:top}
.md code{background:#262624;padding:1px 5px;border-radius:4px;font-size:13.5px}
.md a{color:var(--orange);cursor:pointer}
.card-kw{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 4px}
.card-kw span{font-size:13px;border:1px solid #4A4A36;color:var(--khaki-l);border-radius:14px;padding:2px 10px}
.one{font-size:16px;line-height:1.7;margin:10px 0;padding:10px 14px;border-left:2px solid var(--khaki);background:#1A1A17}
.recall{border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel)}
.recall .q{font-size:17px;line-height:1.7}
.recall .a{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.grade{display:flex;gap:8px;margin-top:16px}
.grade button{flex:1;min-height:48px;border-radius:10px;border:1px solid var(--line);background:none;cursor:pointer;font-size:15px}
.grade button:last-child{border-color:var(--khaki)}
.empty{color:var(--mute);font-size:14px;line-height:1.8}
.banner{position:fixed;left:12px;right:12px;bottom:calc(14px + env(safe-area-inset-bottom));z-index:9;min-height:44px;border-radius:10px;border:1px solid var(--orange);background:#2A2420;color:var(--text);font-size:14px}
.meta{font-size:13px;color:var(--mute);margin:2px 0 10px}
.mast{display:flex;align-items:baseline;justify-content:space-between;border-bottom:2px solid var(--text);padding-bottom:4px;margin-bottom:4px}
.mast b{font-size:20px;letter-spacing:.16em}.mast span{font-size:12px;color:var(--mute)}
.dnav{display:flex;gap:8px;margin:8px 0 6px}.dnav .btn{min-height:34px}
.piece{border-top:1px solid var(--line);padding:12px 0}
.piece .lab{font-size:11.5px;letter-spacing:.08em;color:var(--khaki-l);font-weight:700}
.piece h4{margin:2px 0 6px;font-size:15px;font-weight:500}
.piece .lead{font-weight:500;margin:4px 0 6px;font-size:15.5px}
.piece .src{font-size:12px;color:var(--mute)}
.qz{margin:12px 0}.qz .w{font-size:12px;color:var(--mute)}
.qz textarea{min-height:56px;margin-top:6px}
.qz .ok{margin-top:6px;font-size:14px;color:var(--khaki-l);border-left:2px solid var(--khaki);padding-left:8px}
details{margin:14px 0;color:var(--sub)}
.stari{float:right;width:104px;height:104px;margin:0 0 6px 12px}
.stari.big{width:140px;height:140px}
.sname{clear:right;float:right;font-size:11.5px;color:var(--khaki-l);margin:-4px 0 6px 12px;max-width:140px;text-align:right}
.sv line,.sv path{stroke:#6a6a62;stroke-width:1}.sv .d{fill:#ECECE8}.sv .b{fill:#C9C68A}.sv .g{fill:#C9C68A;opacity:.2}.sv text{fill:#8B8B85;font-size:6.5px;font-family:sans-serif}
.piece::after{content:"";display:block;clear:both}summary{cursor:pointer;min-height:36px}
@media print{.sv .d{fill:#111}.sv .b,.sv .g{fill:#5c5b30}.sv line,.sv path{stroke:#888}
 header,.noprint,nav,#banner{display:none!important}body{background:#fff;color:#111;font-size:11pt}
 main{max-width:none;padding:0}.mast{border-color:#111}.one{background:#f2f2ec;color:#111}.piece{border-color:#bbb}
 .piece .lab{color:#5c5b30}textarea{border:0;border-bottom:1px solid #999;background:none;min-height:44px;color:#111}
 .card-kw span{color:#333;border-color:#999}.quiet,.piece .src,.qz .w{color:#555}}
</style>
</head>
<body>
<header>
  <div class="top">
    <div class="brand">Cosmos</div>
    <span id="sync"></span>
    <button class="hb" id="bRef" title="OneDrive에서 다시 받기" aria-label="OneDrive에서 다시 받기">↻</button>
    <button class="hb" id="bOut" title="로그아웃" aria-label="로그아웃">⏻</button>
  </div>
  <nav id="tabs">
    <button data-v="daily">오늘</button>
    <button data-v="write">쓰기</button>
    <button data-v="flow">흐름</button>
    <button data-v="find">찾기</button>
    <button data-v="map">지도</button>
  </nav>
</header>
<main id="view"></main>
<script src="msal-browser.min.js"></script>
<script>
(function () {
"use strict";
/* ================= 설정 ================= */
const CFG = {
  clientId: "40855125-e565-46a2-b87c-0b74733a1276",
  redirectUri: "https://andreas-jeon.github.io/cosmos/",
  root: "My workspace/Cosmos",
  scopes: ["Files.ReadWrite"]
};
const FILE_MODE = location.protocol === "file:";
const LOCAL = /^(localhost|127\.0\.0\.1)$/.test(location.hostname);
if (!FILE_MODE && location.hostname !== "andreas-jeon.github.io") CFG.redirectUri = location.origin + location.pathname.replace(/index\.html$/, "");
const DEVICE = /Android|iPhone|iPad|Mobile/i.test(navigator.userAgent) ? "폰" : "PC";
const INTERVALS = [1, 3, 7, 21, 60, 180];

const $ = s => document.querySelector(s);
const view = $("#view");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const pad = n => String(n).padStart(2, "0");
const ymd = d => d.getFullYear() + "-" + pad(d.getMonth() + 1) + "-" + pad(d.getDate());
const hm = d => pad(d.getHours()) + ":" + pad(d.getMinutes());
const dayMs = 864e5;
const parseDate = s => { const m = String(s || "").match(/(\d{4})-(\d\d)-(\d\d)(?:[ T_](\d\d):?(\d\d))?/); return m ? new Date(+m[1], m[2] - 1, +m[3], +(m[4] || 0), +(m[5] || 0)) : null; };
function sync(t) { $("#sync").textContent = t; }
function banner(text, fn) {
  let b = $("#banner"); if (!b) { b = document.createElement("button"); b.id = "banner"; b.className = "banner"; document.body.appendChild(b); }
  b.textContent = text; b.onclick = () => { b.remove(); if (fn) fn(); };
}

/* ================= 저장소 (IndexedDB) ================= */
function idb() { return new Promise((ok, no) => { const r = indexedDB.open("cosmos", 1); r.onupgradeneeded = () => r.result.createObjectStore("kv"); r.onsuccess = () => ok(r.result); r.onerror = () => no(r.error); }); }
function kv(mode, key, val) {
  return idb().then(db => new Promise((ok, no) => { const st = db.transaction("kv", mode).objectStore("kv"); const q = mode === "readonly" ? st.get(key) : st.put(val, key); q.onsuccess = () => ok(q.result); q.onerror = () => no(q.error); })).catch(() => null);
}
const get = k => kv("readonly", k), put = (k, v) => kv("readwrite", k, v);
const draftGet = () => { try { return localStorage.getItem("cosmos.draft") || ""; } catch (e) { return ""; } };
const draftSet = v => { try { localStorage.setItem("cosmos.draft", v); } catch (e) {} };

/* ================= 로그인·OneDrive ================= */
const pca = (!FILE_MODE && window.msal) ? new msal.PublicClientApplication({
  auth: {clientId: CFG.clientId, authority: "https://login.microsoftonline.com/consumers", redirectUri: CFG.redirectUri},
  cache: {cacheLocation: "localStorage"}
}) : null;
const account = () => pca && (pca.getActiveAccount() || pca.getAllAccounts()[0]) || null;
function token(interactive) {
  if (!pca) return Promise.resolve(null);
  const acc = account();
  if (!acc) { if (interactive) pca.loginRedirect({scopes: CFG.scopes, prompt: "select_account"}); return Promise.resolve(null); }
  pca.setActiveAccount(acc);
  return pca.acquireTokenSilent({scopes: CFG.scopes, account: acc}).then(r => r.accessToken, () => { if (interactive) pca.acquireTokenRedirect({scopes: CFG.scopes, account: acc}); return null; });
}
const enc = p => p.split("/").map(encodeURIComponent).join("/");
function graph(path, tk, opt) {
  opt = opt || {};
  return fetch("https://graph.microsoft.com/v1.0" + path, {method: opt.method || "GET", body: opt.body, headers: Object.assign({Authorization: "Bearer " + tk}, opt.headers || {})}).then(r => {
    if (r.ok) return opt.raw ? r : r.json();
    return r.text().then(t => { const e = new Error("OneDrive " + r.status); e.status = r.status; e.detail = t.slice(0, 300); throw e; });
  });
}
function upload(rel, text, tk) {
  return graph("/me/drive/root:/" + enc(CFG.root + "/" + rel) + ":/content", tk, {method: "PUT", body: text, headers: {"Content-Type": "text/plain; charset=utf-8"}});
}

/* ================= 색인 받기 ================= */
const parseData = t => JSON.parse(t.slice(t.indexOf("{"), t.lastIndexOf("}") + 1));
function refresh(tk, force) {
  return graph("/me/drive/root:/" + enc(CFG.root + "/_app/data.js"), tk).then(meta => get("etag").then(old => {
    if (!force && old && old === meta.eTag) return null;
    const viaGraph = () => fetch("https://graph.microsoft.com/v1.0/me/drive/items/" + meta.id + "/content", {headers: {Authorization: "Bearer " + tk}}).then(r => { if (!r.ok) throw new Error("download " + r.status); return r.text(); });
    const url = meta["@microsoft.graph.downloadUrl"];
    return (url ? fetch(url).then(r => { if (!r.ok) throw new Error("download " + r.status); return r.text(); }).catch(viaGraph) : viaGraph())
      .then(text => put("text", text).then(() => put("etag", meta.eTag)).then(() => text));
  }));
}

/* ================= 자료 모형 ================= */
let DATA = null, FILES = [], ITEMS = [], TH = {}, KD = {}, THEMES = [], KINDS = [];
let byPath = {}, byName = {}, itemById = {}, itemByName = {}, NOTES = [], CARDS = [], REVIEWS = [], S = null;
let OUTBOX = [], SESSION = null;
const layerName = k => ({center: "나·대문", principles: "원리", cases: "사례", capabilities: "역량", work: "일", base: "삶의 바탕", library: "자료", tools: "도구", log: "기록", root: "Cosmos", stream: "흐름", card: "자료 카드", other: "기타"})[k] || k;
const bodyOf = t => t.startsWith("---") && t.indexOf("\n---", 3) > 0 ? t.slice(t.indexOf("\n---", 3) + 4).replace(/^\s+/, "") : t;
const firstLine = t => (bodyOf(t).split("\n").find(l => l.trim()) || "").replace(/^#+\s*/, "").trim();
const cut = (s, n) => s.length > n ? s.slice(0, n) + "…" : s;
const kindName = id => (KD[id] && KD[id]["이름"]) || "하루";
const themeName = id => (TH[id] && TH[id]["이름"]) || "";
const yes = v => /^(예|yes|y|true|1|o)$/i.test(String(v || "").trim());

function noteOf(f) {
  const fm = f.fm || {}, d = parseDate(fm["날짜"]) || parseDate(f.name) || parseDate(f.mtime);
  const body = bodyOf(f.text);
  return {path: f.path, file: f, date: d, kind: fm["종류id"] || "day", theme: fm["주제id"] || "", tags: (fm["태그"] || "").split(/[;,]/).map(s => s.trim()).filter(Boolean),
    remember: yes(fm["기억"]), body: body, title: cut(firstLine(f.text) || f.name, 60), src: fm["출처"] || ""};
}
function buildModel() {
  THEMES = DATA.themes || []; KINDS = DATA.kinds || [];
  TH = {}; THEMES.forEach(t => TH[t.id] = t); KD = {}; KINDS.forEach(k => KD[k.id] = k);
  FILES = DATA.files || []; byPath = {}; byName = {};
  FILES.forEach(f => { byPath[f.path] = f; byPath[f.path.replace(/\.md$/, "")] = f; (byName[f.name] = byName[f.name] || []).push(f); });
  ITEMS = []; itemById = {}; itemByName = {};
  (DATA.sources || []).forEach(s => s.items.forEach(it => {
    const m = it.meta || {};
    it.src = s.label; it.isItem = true; it.title = m.t || it.name; it.fields = m.f || []; it.works = m.w || []; it.kws = m.k || [];
    ITEMS.push(it); if (m.i) itemById[m.i] = it; (itemByName[it.name.toLowerCase()] = itemByName[it.name.toLowerCase()] || []).push(it);
  }));
  NOTES = FILES.filter(f => f.layer === "stream" && f.kind === "file").map(noteOf);
  CARDS = FILES.filter(f => f.layer === "card");
  REVIEWS = (DATA.reviews || []).slice();
  S = makeSearch();
}
const resolve = l => { l = l.trim(); const base = l.replace(/\.md$/, ""); const md = byPath[base] || (byName[base.split("/").pop()] || [])[0]; if (md) return md; const nm = l.split("/").pop().replace(/\.(pdf|url|docx?|pptx?|hwpx?|xlsx?|txt|html?)$/i, "").toLowerCase(); return (itemByName[nm] || [])[0] || null; };
const cardFile = it => it && it.meta && it.meta.c ? byPath[it.meta.c] : null;

/* ================= 자동 분류 (themes.csv / kinds.csv 규칙) ================= */
function themeOf(text) {
  const tags = (text.match(/#([^\s#]+)/g) || []).map(t => t.slice(1).replace(/_/g, " ").replace(/\s/g, ""));
  const base = t => t["이름"].replace(/\(.*?\)/g, "").replace(/\s/g, ""), en = t => (t["영문"] || "").replace(/\s/g, "").toLowerCase();
  for (const t of THEMES) if (tags.includes(base(t)) || (en(t) && tags.map(x => x.toLowerCase()).includes(en(t)))) return t.id;
  const low = text.toLowerCase(); let best = "", bs = 0;
  for (const t of THEMES) {
    let n = 0; (t["낱말"] || "").split("|").filter(Boolean).forEach(w => { let i = 0; w = w.toLowerCase(); while ((i = low.indexOf(w, i)) >= 0) { n++; i += w.length; } });
    if (n > bs) { best = t.id; bs = n; }
  }
  return best;
}
function kindOf(text, theme) {
  const tags = (text.match(/#([^\s#]+)/g) || []).map(t => t.slice(1).replace(/_/g, " "));
  for (const k of KINDS) if (tags.includes(k["이름"])) return k.id;
  const urls = (text.match(/https?:\/\/\S+/g) || []).map(u => u.toLowerCase());
  for (const k of KINDS) {
    const cue = k["단서"] || "";
    if (!cue) return k.id;
    if (cue.startsWith("url:")) { if (urls.some(u => cue.slice(4).split("|").some(h => u.includes(h)))) return k.id; }
    else if (cue.startsWith("theme:")) { if (cue.slice(6).split("|").includes(theme)) return k.id; }
    else { try { if (new RegExp(cue.startsWith("re:") ? cue.slice(3) : cue, "im").test(text)) return k.id; } catch (e) {} }
  }
  return "day";
}
function classify(text) {
  let th = themeOf(text); const k = kindOf(text, th);
  if (!th) th = (KD[k] && KD[k]["기본주제"]) || "mind";
  const tags = Array.from(new Set((text.match(/#([^\s#]+)/g) || []).map(t => t.slice(1)).filter(t => !KINDS.some(x => x["이름"] === t) && !THEMES.some(x => x["이름"].replace(/\(.*?\)/g, "").replace(/\s/g, "") === t))));
  return {kind: k, theme: th, tags, remember: ["lesson", "tech", "book", "question", "field"].includes(k)};
}

/* ================= 떠올리기 일정 (간격 반복) ================= */
function history() {
  const h = {};
  REVIEWS.concat(SESSION ? SESSION.rows : []).forEach(([d, t, r]) => { (h[t] = h[t] || []).push([parseDate(d), r]); });
  Object.values(h).forEach(a => a.sort((x, y) => x[0] - y[0]));
  return h;
}
function targets() {
  const out = [], H = history();
  NOTES.concat(OUTBOX.map(o => o.note)).forEach(n => { if (n.remember) out.push({id: "note:" + n.path, note: n, q: n.title, born: n.date, theme: n.theme}); });
  CARDS.forEach(f => {
    if (!H["card:" + f.path]) return;
    const it = itemById[(f.fm || {})["자료"]];
    out.push({id: "card:" + f.path + "#gist", card: f, item: it, q: it ? it.title : f.title, born: H["card:" + f.path][0][0], theme: (f.fm || {})["주제id"] || (it && it.meta && it.meta.th) || "sight"});
  });
  const now = new Date();
  out.forEach(t => {
    let step = -1, last = t.born || now, lastR = "";
    (H[t.id] || []).forEach(([d, r]) => {
      if (r === "시작") return;
      last = d; lastR = r;
      if (r === "기억남" || r === "선명") step = Math.min(step + 1, INTERVALS.length - 1);
      else if (r === "흐릿함" || r === "어렴풋") step = Math.max(step, 0);

function record(target, result) {

  clearTimeout(record.t); record.t = setTimeout(saveSession, 1500);
}
function saveSession() {

/* ---------- 별자리 (점과 선으로 그린 기억 그림) ---------- */
function parseStar(text) {
  const st = {name: "", pts: [], lines: [], curves: [], bright: "", auto: false}, kv = {};
  if (/^\s*-\s/m.test(text)) text.split("\n").forEach(l => { const m = l.match(/^\s*-\s*([^:]+):\s*(.*)$/); if (m) kv[m[1].trim().replace(/^밝은\s*점$/, "밝은")] = m[2].trim(); });
  else text.split(";").forEach(x => { const i = x.indexOf("="); if (i > 0) kv[x.slice(0, i).trim()] = x.slice(i + 1).trim(); });
  st.name = kv["이름"] || "";
  (kv["점"] || "").split(",").forEach(t => { const q = t.trim().split(/\s+/); if (q.length >= 3) st.pts.push([q.slice(0, -2).join(" "), +q[q.length - 2], +q[q.length - 1]]); });
  st.lines = (kv["선"] || "").split(",").filter(t => t.includes("-")).map(t => { const i = t.indexOf("-"); return [t.slice(0, i).trim(), t.slice(i + 1).trim()]; });
  st.curves = (kv["곡선"] || "").split(",").map(t => t.trim()).filter(t => t.includes("~"));
  st.bright = kv["밝은"] || ""; st.auto = !!kv["자동"];
  return st;
}
/* 곡선: 'a~b 15' 두 점 사이 활(휨 15, 음수는 반대쪽) / 'a~b~c' 점들을 지나는 부드러운 곡선(처음=끝이면 고리) */
function curvePath(spec, P) {
  const parts = spec.split(/\s+/), names = parts[0].split("~").map(x => x.trim()), bend = parts.length > 1 ? +parts[1] : 12;
  let pts = names.filter(n => P[n]).map(n => P[n]); if (pts.length < 2) return "";
  const f = v => v.toFixed(1);
  if (pts.length === 2) { const [[x1, y1], [x2, y2]] = pts, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1; return "M" + f(x1) + " " + f(y1) + " Q" + f((x1 + x2) / 2 - dy / L * bend) + " " + f((y1 + y2) / 2 + dx / L * bend) + " " + f(x2) + " " + f(y2); }
  const closed = names[0] === names[names.length - 1]; if (closed) pts = pts.slice(0, -1);
  const n = pts.length, get = i => closed ? pts[((i % n) + n) % n] : pts[Math.max(0, Math.min(n - 1, i))];
  let d = "M" + f(pts[0][0]) + " " + f(pts[0][1]);
  for (let i = 0; i < (closed ? n : n - 1); i++) { const p0 = get(i - 1), p1 = get(i), p2 = get(i + 1), p3 = get(i + 2); d += " C" + f(p1[0] + (p2[0] - p0[0]) / 6) + " " + f(p1[1] + (p2[1] - p0[1]) / 6) + " " + f(p2[0] - (p3[0] - p1[0]) / 6) + " " + f(p2[1] - (p3[1] - p1[1]) / 6) + " " + f(p2[0]) + " " + f(p2[1]); }
  return d + (closed ? " Z" : "");
}
function starSvg(st, cls) {
  if (!st || !st.pts.length) return "";
  const P = {}; st.pts.forEach(([n, x, y]) => P[n] = [x, y]);
  let h = '<div class="stari ' + (cls || "") + '"><svg class="sv" viewBox="-16 -8 132 116" width="100%" height="100%" role="img" aria-label="' + esc(st.name) + '">';
  st.lines.forEach(([a, b]) => { if (P[a] && P[b]) h += '<line x1="' + P[a][0] + '" y1="' + P[a][1] + '" x2="' + P[b][0] + '" y2="' + P[b][1] + '"/>'; });
  (st.curves || []).forEach(c => { const d = curvePath(c, P); if (d) h += '<path d="' + d + '" fill="none"/>'; });
  st.pts.forEach(([n, x, y]) => {
    h += n === st.bright ? '<circle class="g" cx="' + x + '" cy="' + y + '" r="7"/><circle class="b" cx="' + x + '" cy="' + y + '" r="3.6"/>' : '<circle class="d" cx="' + x + '" cy="' + y + '" r="2.4"/>';
    if (!st.auto && n.length > 1 && !/^[a-zA-Z]?\d*$/.test(n)) {
      let ux = x - 50, uy = y - 50; const L = Math.hypot(ux, uy); if (L > 3) { ux /= L; uy /= L; } else { ux = 0; uy = -1; }
      h += '<text x="' + (x + ux * 7).toFixed(1) + '" y="' + (y + uy * 8 + 2.2).toFixed(1) + '" text-anchor="' + (ux > .35 ? "start" : ux < -.35 ? "end" : "middle") + '">' + esc(n) + "</text>";
    }
  });
  return h + "</svg></div>" + (st.name ? '<div class="sname">' + esc(st.name) + "</div>" : "");
}

let dailyIdx = -1;
const dailies = () => FILES.filter(f => f.layer === "daily" && f.kind === "file").sort((a, b) => a.name.localeCompare(b.name));
const sheetAnswered = d => allNotes().some(n => n.body.startsWith("# COSMOS DAILY") && n.body.split("\n")[0].includes(d));
function recallLink() {
  const n = queue().length;
  return n ? '<p class="noprint" style="margin-top:20px"><button class="btn" id="goRecall">내 기록 떠올리기 ' + n + "개</button></p>" : "";
}
function sectionsOf(text) {
  const sec = {order: []}; bodyOf(text).split(/\n## /).forEach((x, i) => { if (i === 0) { sec._h = x.replace(/^#\s*/, "").trim(); return; } const nl = x.indexOf("\n"); const k = x.slice(0, nl < 0 ? x.length : nl).trim(); sec[k] = nl < 0 ? "" : x.slice(nl + 1).trim(); sec.order.push(k); });
  return sec;
}
function showDaily() {
  const L = dailies();

  if (dailyIdx < 0 || dailyIdx >= L.length) dailyIdx = L.length - 1;
  const f = L[dailyIdx], sec = sectionsOf(f.text), d = (f.fm || {})["날짜"] || f.name, done = sheetAnswered(d);

  const ans = (sec["정답"] || "").split("\n").map(l => l.replace(/^-\s*\d+\.\s*/, "").trim()).filter(Boolean);

    '<div class="mast"><b>COSMOS DAILY</b><span>' + esc((sec._h || "").replace(/^COSMOS DAILY\s*·\s*/, "")) + "</span></div>";
  if (sec["오늘의 한 줄"]) { const t = sec["오늘의 한 줄"].split("\n"); h += '<div class="one" style="font-size:17px">' + esc(t[0].replace(/^>\s*/, "")) + '</div><p class="quiet">' + esc((t.find(x => x.startsWith("—")) || "").replace(/^—\s*/, "")) + "</p>"; }
  pieces.forEach(k => {
    const m = k.match(/^(\d+)\.\s*(.*?)\s*·\s*(.*)$/) || [k, "", "", k], lines = sec[k].split("\n");
    const lead = (lines.find(l => /^\*\*/.test(l)) || "").replace(/\*\*/g, ""), src = (lines.find(l => l.startsWith("출처:")) || "").replace("출처:", "").trim();

  });

  if (mineK) h += "<h3>" + esc(mineK) + '</h3><div class="md">' + md(sec[mineK]) + "</div>";
  h += "<h3>퀴즈</h3>" + quiz.map((m, i) => '<div class="qz"><div>' + esc(m[1] + ". " + m[2]) + '</div><div class="w">' + esc(m[3] || "") + '</div><textarea data-q="' + i + '" placeholder="떠오르는 대로"' + (done ? " disabled" : "") + "></textarea>" +
    '<div class="ok" data-a="' + i + '"' + (done ? "" : " hidden") + ">" + esc(ans[i] || "") + "</div></div>").join("");
  h += '<h3>자유롭게</h3><textarea id="dFree" placeholder="오늘 읽고 떠오른 것, 내 일과 이어지는 것"' + (done ? " disabled" : "") + "></textarea>" +
    '<div class="row noprint" style="margin-top:10px"><label class="btn" style="display:flex;align-items:center">사진으로 올리기<input type="file" id="dPhoto" accept="image/*" capture="environment" hidden multiple></label>' +
    '<span class="quiet" id="dPh"></span><button class="primary" id="dSend"' + (done || FILE_MODE ? " disabled" : "") + ">" + (done ? "제출함" : "제출하고 답 보기") + "</button></div>";

  detail('<div class="meta"><span class="tag k">' + esc(kindName(n.kind)) + "</span>" + esc(themeName(n.theme)) + " · " + (n.date ? ymd(n.date) + " " + hm(n.date) : "") + (n.src ? " · " + esc(n.src) : "") + (n.tags.length ? " · #" + n.tags.map(esc).join(" #") : "") + "</div>" +
    '<div class="md">' + md(n.body) + "</div>" + (r.length ? '<h3>이어지는 기억</h3><div class="list">' + r.map(x => itemRow(x.d.ref, x.d.topic)).join("") + "</div>" : "") +
    (n.pending ? '<p class="quiet pend">아직 OneDrive에 올라가지 않음</p>' : '<p class="quiet">고치려면: OneDrive의 Cosmos/' + esc(n.path) + "</p>"));
}
function openPath(p) {
  const f = byPath[p]; if (!f) return;
  if (f.layer === "stream") return openNote(p);
  if (f.layer === "card") { const it = itemById[(f.fm || {})["자료"]]; if (it) return openItem(it); }
  detail('<div class="meta">' + esc(layerName(f.layer)) + " · " + esc(f.path) + " · " + esc(f.mtime) + '</div><div class="md">' + md(bodyOf(f.text)) + "</div>");
}
function openItem(it) {
  if (!it) return;
  const c = cardFile(it), m = it.meta || {}, started = c && history()["card:" + c.path];
  let html = "";
  if (c) {
    const sec = {}; bodyOf(c.text).split(/\n## /).forEach((s, i) => { if (i === 0) { sec._h = s.replace(/^#\s*/, "").trim(); return; } const nl = s.indexOf("\n"); sec[s.slice(0, nl).trim()] = s.slice(nl + 1).trim(); });
    const kw = (sec["핵심 키워드"] || "").replace(/^-\s*/, "").split(/\s*·\s*/).filter(Boolean);
    html += (sec["별자리"] ? starSvg(parseStar(sec["별자리"]), "big") : "") + "<h2>" + esc(sec._h || it.title) + '</h2><div class="meta">' + esc([m.a, m.y, m.d, (c.fm || {})["요약 기준"] ? "요약 기준: " + c.fm["요약 기준"] : ""].filter(Boolean).join(" · ")) + "</div>" +
      '<div class="card-kw">' + kw.map(k => "<span>" + esc(k) + "</span>").join("") + "</div>" +
      (sec["한 줄 요약"] ? '<div class="one">' + esc(sec["한 줄 요약"]) + "</div>" : "") +
      '<div class="md">' + ["쉬운 요약", "원리", "방법", "핵심 수식", "핵심 수치", "내 일과 연결 [직접]", "떠올릴 질문"].filter(k => sec[k] !== undefined).map(k => "<h2>" + esc(k) + "</h2>" + md(sec[k])).join("") + "</div>" +
      '<div class="row" style="margin-top:14px"><button class="btn' + (started ? " on" : "") + '" id="bStart">' + (started ? "다시 만나는 중" : "다시 만나기 시작") + "</button></div>";
  } else {
    html += "<h2>" + esc(it.title) + '</h2><div class="meta">' + esc([m.a, m.y, m.d, it.src].filter(Boolean).join(" · ")) + "</div>" +
      (it.kws.length ? '<div class="card-kw">' + it.kws.map(k => "<span>" + esc(k) + "</span>").join("") + "</div>" : "") +
      '<p class="empty">아직 자료 카드가 없음. 기존 자료는 묶음으로 차례차례 카드가 만들어짐.</p>' + (it.text ? '<div class="md">' + md(it.text) + "</div>" : "");
  }
  html += '<h3>원문</h3><div class="list">' + (it.url ? '<a class="it" href="' + esc(it.url) + '" target="_blank" rel="noopener"><span class="t">웹 주소 열기</span><small>' + esc(it.url) + "</small></a>" : '<button class="it" id="bOpen"><span class="t">원문 열기</span><small>' + esc(it.name + it.ext) + "</small></button>") + "</div>";
  detail(html, () => {
    const o = $("#bOpen"); if (o) o.onclick = () => openOriginal(it.full, o);
    const s = $("#bStart"); if (s && !started) s.onclick = () => { record("card:" + c.path, "시작"); s.textContent = "다시 만나는 중"; s.classList.add("on"); };
  });
}
function openOriginal(full, btn) {
  const m = String(full).replace(/\\/g, "/").match(/\/OneDrive[^/]*\/(.+)$/i);
  if (!m) { alert("OneDrive 밖의 파일이라 열 수 없음"); return; }
  if (FILE_MODE) { location.href = "file:///" + full.replace(/\\/g, "/"); return; }
  const w = window.open("about:blank", "_blank"), lab = btn.querySelector(".t"); lab.textContent = "여는 중…";
  token(true).then(tk => { if (!tk) { if (w) w.close(); return; } return graph("/me/drive/root:/" + enc(m[1]) + "?select=webUrl", tk).then(x => { if (w) w.location.href = x.webUrl; else location.href = x.webUrl; lab.textContent = "원문 열기"; }); })
    .catch(e => { if (w) w.close(); lab.textContent = "원문 열기"; alert(e.status === 404 ? "OneDrive에서 파일을 찾지 못함" : "열지 못함: " + e.message); });
}

/* ---------- 마크다운 (간단) ---------- */
function inline(s) {
  s = esc(s);
  s = s.replace(/\[\[(.+?)(?:\|([^\]]+))?\]\](?!\])/g, (m, a, b) => '<a data-link="' + a.trim() + '">' + (b || a.split("/").pop()) + "</a>");
  s = s.replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g, '$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`([^`]+)`/g, "<code>$1</code>");
}
function md(text) {
  const L = String(text || "").replace(/\r/g, "").split("\n"); let h = "", list = false, tbl = null;
  const close = () => { if (list) { h += "</ul>"; list = false; } if (tbl) { h += "<table>" + tbl.map((r, i) => "<tr>" + r.map(c => (i ? "<td>" : "<th>") + inline(c) + (i ? "</td>" : "</th>")).join("") + "</tr>").join("") + "</table>"; tbl = null; } };
  for (const raw of L) {
    const l = raw.trimEnd();
    if (/^\s*\|/.test(l)) { if (/^\s*\|[\s:|-]+\|\s*$/.test(l)) continue; const cells = l.trim().replace(/^\||\|$/g, "").split("|").map(c => c.trim()); if (list) { h += "</ul>"; list = false; } (tbl = tbl || []).push(cells); continue; }
    if (tbl) close();
    let m;
    if ((m = l.match(/^(#{1,4})\s+(.*)/))) { close(); h += "<h" + m[1].length + ">" + inline(m[2]) + "</h" + m[1].length + ">"; }
    else if ((m = l.match(/^\s*(?:[-*]|\d+\.)\s+(.*)/))) { if (!list) { h += "<ul>"; list = true; } h += "<li>" + inline(m[1]) + "</li>"; }
    else if ((m = l.match(/^>\s?(.*)/))) { close(); h += "<blockquote>" + inline(m[1]) + "</blockquote>"; }
    else if (!l.trim()) close();
    else if (list && /^\s{2,}/.test(raw)) h = h.replace(/<\/li>$/, "<br>" + inline(l.trim()) + "</li>");
    else { close(); h += "<p>" + inline(l) + "</p>"; }
  }
  close(); return h;
}

/* ================= 시작 ================= */
$("#bRef").onclick = () => { if (FILE_MODE) return location.reload(); token(true).then(tk => tk && refresh(tk, true).then(t => { if (t) { DATA = parseData(t); buildModel(); go(current); sync("새로 받음 " + hm(new Date())); } })).catch(e => banner("받지 못함: " + e.message)); };
$("#bOut").onclick = () => { if (!pca || !confirm("로그아웃하고 이 기기에 저장된 색인을 지울까요? (저장 대기 중인 기록은 남음)")) return; put("text", "").then(() => put("etag", "")).then(() => pca.logoutRedirect({account: account()})); };
function login(msg) { view.innerHTML = '<h2>Cosmos</h2><p class="empty">' + (msg || "나의 기억 공간. 내 OneDrive의 Cosmos 폴더를 읽고, 쓴 기록을 그곳에 남김.<br>처음 한 번 Microsoft 계정으로 로그인하고 파일 읽기·쓰기 권한을 허용하면 됨.") + '</p><button class="primary" id="bIn" style="margin:0">Microsoft 계정으로 로그인</button>'; $("#bIn").onclick = () => token(true); }
function start(text) { try { DATA = typeof text === "string" ? parseData(text) : text; buildModel(); if (!start.once) { start.once = 1; const L = dailies(), last = L[L.length - 1]; current = last && !sheetAnswered((last.fm || {})["날짜"] || last.name) ? "daily" : "write"; } go(current); } catch (e) { view.innerHTML = '<p class="empty">색인을 읽지 못함: ' + esc(e.message) + "</p>"; } }

function main() {
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", "false"));
  if ("serviceWorker" in navigator && !FILE_MODE && !LOCAL) navigator.serviceWorker.register("sw.js").catch(() => {});
  get("outbox").then(o => { OUTBOX = (o || []).map(x => ({rel: x.rel, text: x.text, note: Object.assign(noteOfText(x.rel, x.text), {pending: true})})); });
  get("session").then(s => { if (s && s.rows && s.rows.length && s.rel.slice(13, 23) === ymd(new Date())) SESSION = s; });
  if (FILE_MODE || (LOCAL && /[?&]local\b/.test(location.search))) {

    if (window.COSMOS_DATA) return start(window.COSMOS_DATA);

  }
  if (!pca) { view.innerHTML = '<p class="empty">로그인 모듈을 불러오지 못함. 인터넷 연결 확인</p>'; return; }
  view.innerHTML = '<p class="empty">불러오는 중…</p>';

    if (cached) start(cached);
    if (!account()) { if (!cached) login(); return; }
    if (!cached) view.innerHTML = '<p class="empty">OneDrive에서 색인을 받는 중… (처음 한 번 1 MB 정도)</p>';
    return token(false).then(tk => {
      if (!tk) { if (cached) banner("로그인이 만료됨 · 눌러서 다시 로그인", () => token(true)); else login("다시 로그인이 필요함 (쓰기 권한이 추가되어 한 번 더 허용이 필요할 수 있음)."); return; }
      sync("확인 중…");
      return refresh(tk).then(text => {
        sync("최신 " + hm(new Date()));
        if (text) { if (DATA) { DATA = parseData(text); buildModel(); if (current !== "write") go(current); } else start(text); }
        flush(); if (SESSION) saveSession();
      });
    }).catch(e => { if (DATA) sync("저장된 색인으로 보는 중"); else view.innerHTML = '<p class="empty">색인을 받지 못함: ' + esc(e.message) + (e.detail ? "<br><small>" + esc(e.detail) + "</small>" : "") + "</p>"; });
  }).catch(e => login("로그인 오류: " + esc(e.message)));
  window.addEventListener("online", flush);
}
function noteOfText(rel, text) {
  const f = {path: rel, name: rel.split("/").pop().replace(/\.md$/, ""), text, fm: {}, mtime: ""};
  text.split("\n---")[0].split("\n").slice(1).forEach(l => { const m = l.match(/^([^:]+):\s*(.*)$/); if (m) f.fm[m[1].trim()] = m[2].trim(); });
  return noteOf(f);
}
